<div class="transition-colors duration-500">
      <div class="min-h-screen bg-white text-gray-900 dark:bg-gray-900 dark:text-gray-100 font-sans antialiased">
        <div class="container mx-auto px-4 py-8 max-w-4xl">
          <div class="flex justify-end p-4">
            <button (click)="toggleDarkMode()" 
                    class="p-2 rounded-full transition-colors duration-300 hover:bg-opacity-80" 
                    [class.bg-gray-200]="!isDarkMode" 
                    [class.bg-gray-700]="isDarkMode"
                    [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
                    [attr.title]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'">
              <svg *ngIf="isDarkMode" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-yellow-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
              </svg>
              <svg *ngIf="!isDarkMode" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-800" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2" />
                <path d="M12 20v2" />
                <path d="M4.93 4.93l1.41 1.41" />
                <path d="M17.66 17.66l1.41 1.41" />
                <path d="M2 12h2" />
                <path d="M20 12h2" />
                <path d="M4.93 19.07l1.41-1.41" />
                <path d="M17.66 6.34l1.41-1.41" />
              </svg>
            </button>
          </div>
          <app-hero></app-hero>
          <app-about></app-about>
          <app-skills></app-skills>
          <app-projects></app-projects>
          <app-contacts></app-contacts>
        </div>
      </div>
    </div>
