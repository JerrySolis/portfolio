 <section id="skills" class="mb-12">
      <h2 class="text-1xl font-semibold mb-4 text-emerald-600 dark:text-emerald-300 border-b-2 border-gray-300 dark:border-gray-700 pb-2">Skills</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-gray-100 dark:bg-gray-800 p-6 rounded-lg shadow-xl">
          <h3 class="text-xl font-bold mb-3 text-blue-700 dark:text-blue-300">Backend</h3>
          <div class="flex flex-wrap gap-2">
            <span *ngFor="let skill of skills.backend" class="px-3 py-1 bg-gray-300 dark:bg-gray-700 text-gray-800 dark:text-gray-100 rounded-full text-sm">
              {{ skill }}
            </span>
          </div>
        </div>
        <div class="bg-gray-100 dark:bg-gray-800 p-6 rounded-lg shadow-xl">
          <h3 class="text-xl font-bold mb-3 text-blue-700 dark:text-blue-300">Frontend</h3>
          <div class="flex flex-wrap gap-2">
            <span *ngFor="let skill of skills.frontend" class="px-3 py-1 bg-gray-300 dark:bg-gray-700 text-gray-800 dark:text-gray-100 rounded-full text-sm">
              {{ skill }}
            </span>
          </div>
        </div>
        <div class="bg-gray-100 dark:bg-gray-800 p-6 rounded-lg shadow-xl">
          <h3 class="text-xl font-bold mb-3 text-blue-700 dark:text-blue-300">Database</h3>
          <div class="flex flex-wrap gap-2">
            <span *ngFor="let skill of skills.database" class="px-3 py-1 bg-gray-300 dark:bg-gray-700 text-gray-800 dark:text-gray-100 rounded-full text-sm">
              {{ skill }}
            </span>
          </div>
        </div>
      </div>
    </section>
