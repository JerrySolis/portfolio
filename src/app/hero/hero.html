    <header class="text-center py-12 md:py-16 flex flex-col items-center">
      <div class="profile-container relative group w-32 h-32 md:w-40 md:h-40 mb-4">
        <div class="relative w-full h-full">
          <img
            class="profile-morph w-full h-full object-cover transition-all duration-500
                   border-4 border-gray-700 dark:border-gray-300 
                   shadow-md group-hover:shadow-xl"
            src="{{ personalInfo.profilePicture }}"
            alt="Profile"
          />
          <div class="absolute inset-0 profile-morph pointer-events-none opacity-0 
                      group-hover:opacity-30 transition-opacity duration-300
                      bg-gradient-to-tr from-emerald-400/10 to-blue-400/10"></div>
        </div>
      </div>
      <h1 class="text-4xl sm:text-5xl md:text-6xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 animate-gradient-x">
        {{ personalInfo.name }}
      </h1>
      <p class="text-xl sm:text-2xl mt-2 text-gray-700 dark:text-gray-300 animate-fade-in">{{ personalInfo.title }}</p>
    </header>
